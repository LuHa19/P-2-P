<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Network Simulator</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #1e1e24; 
            color: #fff; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
        }
        h1 { margin-top: 10px; margin-bottom: 5px; }
        p { color: #aaa; margin-bottom: 20px; text-align: center; max-width: 600px; font-size: 18px;}
        #controls { margin: 15px 0; }
        button { 
            background-color: #4CAF50; 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            text-align: center; 
            font-size: 18px; 
            cursor: pointer; 
            border-radius: 5px; 
            margin: 0 10px; 
            transition: 0.2s;
            font-weight: bold;
        }
        button:hover { background-color: #45a049; }
        button#resetBtn { background-color: #f44336; }
        button#resetBtn:hover { background-color: #da190b; }
        canvas { 
            background-color: #2b2b36; 
            border: 2px solid #555; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        }
        .legend { display: flex; gap: 25px; margin-top: 15px; font-size: 16px; font-weight: bold;}
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .color-box { width: 20px; height: 20px; border-radius: 4px; border: 1px solid #fff; }
    </style>
</head>
<body>

<h1>How Peer-to-Peer (P2P) Works</h1>
<p>Notice how there is <strong>no central server</strong>. All computers share the workload equally across the network!</p>

<div id="controls">
    <button id="addNodeBtn">+ Add a Computer</button>
    <button id="startSharingBtn">▶ Start Sharing File</button>
    <button id="resetBtn">↻ Reset</button>
</div>

<canvas id="networkCanvas" width="800" height="480"></canvas>

<div class="legend">
    <div class="legend-item"><div class="color-box" style="background: #4CAF50;"></div> Has Whole File (100%)</div>
    <div class="legend-item"><div class="color-box" style="background: #FFC107;"></div> Helping Share (25-75%)</div>
    <div class="legend-item"><div class="color-box" style="background: #F44336;"></div> Waiting (0%)</div>
</div>

<script>
    const canvas = document.getElementById('networkCanvas');
    const ctx = canvas.getContext('2d');

    let nodes = [];
    let edges = [];
    let packets = [];
    const maxNodes = 8; 
    let animationId;
    let isSharing = false;

    class Node {
        constructor(id) {
            this.id = id;
            this.x = 0; // X and Y are set dynamically
            this.y = 0; 
            this.status = 'empty'; 
            this.chunks = 0;
            this.maxChunks = 4; // 4 easy steps (25%, 50%, 75%, 100%)
            this.radius = 32; 
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            if (this.status === 'full') {
                ctx.fillStyle = '#4CAF50'; 
            } else if (this.status === 'partial') {
                ctx.fillStyle = '#FFC107'; 
            } else {
                ctx.fillStyle = '#F44336'; 
            }
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            let percentage = (this.chunks / this.maxChunks) * 100;
            ctx.fillText(`${percentage}%`, this.x, this.y);
        }
    }

    class Edge {
        constructor(node1, node2) {
            this.node1 = node1;
            this.node2 = node2;
        }
        draw() {
            ctx.beginPath();
            ctx.moveTo(this.node1.x, this.node1.y);
            ctx.lineTo(this.node2.x, this.node2.y);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.lineWidth = 3;
            ctx.stroke();
        }
    }

    class Packet {
        constructor(source, target) {
            this.source = source;
            this.target = target;
            this.progress = 0;
            this.speed = 0.008; // SLOWED DOWN for classroom viewing
        }
        update() {
            this.progress += this.speed;
        }
        draw() {
            // Because source/target are objects, if they move, the packet adapts instantly!
            const x = this.source.x + (this.target.x - this.source.x) * this.progress;
            const y = this.source.y + (this.target.y - this.source.y) * this.progress;
            ctx.beginPath();
            ctx.arc(x, y, 8, 0, Math.PI * 2); 
            ctx.fillStyle = '#00BCD4'; 
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
        }
    }

    function initNetwork() {
        nodes = [];
        edges = [];
        packets = [];
        isSharing = false;
        
        // Add one initial seeder and one leecher
        addNode(true);
        addNode(false); 
    }

    function updateLayout() {
        const radius = 170; // Radius of the circle
        
        // Arrange computers in a perfect, centered circle
        nodes.forEach((node, index) => {
            const angle = (index * (Math.PI * 2)) / nodes.length;
            node.x = (canvas.width / 2) + radius * Math.cos(angle);
            node.y = (canvas.height / 2) + radius * Math.sin(angle);
        });

        // Rebuild the mesh connections cleanly
        edges = [];
        for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
                // Find shortest distance around the ring
                let distance = Math.min(j - i, nodes.length - (j - i));
                
                // Connect to immediate neighbors (distance 1) and skip-one neighbors (distance 2)
                if (distance === 1 || distance === 2) {
                    edges.push(new Edge(nodes[i], nodes[j]));
                }
            }
        }
    }

    function addNode(isSeeder = false) {
        if (nodes.length >= maxNodes) return;
        
        const newNode = new Node(nodes.length);
        if (isSeeder) {
            newNode.status = 'full';
            newNode.chunks = newNode.maxChunks;
        }
        nodes.push(newNode);
        
        // Refresh the circle shape and connections
        updateLayout();
    }

    function findNeighbors(node) {
        let neighbors = [];
        edges.forEach(e => {
            if (e.node1 === node) neighbors.push(e.node2);
            if (e.node2 === node) neighbors.push(e.node1);
        });
        return neighbors;
    }

    function updateNetwork() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        edges.forEach(e => e.draw());
        
        for (let i = packets.length - 1; i >= 0; i--) {
            let p = packets[i];
            p.update();
            p.draw();
            
            if (p.progress >= 1) {
                if (p.target.chunks < p.target.maxChunks) {
                    p.target.chunks++;
                    if (p.target.chunks === p.target.maxChunks) {
                        p.target.status = 'full';
                    } else {
                        p.target.status = 'partial';
                    }
                }
                packets.splice(i, 1);
            }
        }
        
        nodes.forEach(n => n.draw());
        
        if (isSharing && Math.random() < 0.05) { 
            let senders = nodes.filter(n => n.chunks > 0);
            if (senders.length > 0) {
                let sender = senders[Math.floor(Math.random() * senders.length)];
                let neighbors = findNeighbors(sender);
                let validTargets = neighbors.filter(n => n.chunks < n.maxChunks);
                
                if (validTargets.length > 0 && packets.length < 6) {
                    let target = validTargets[Math.floor(Math.random() * validTargets.length)];
                    packets.push(new Packet(sender, target));
                }
            }
        }
        animationId = requestAnimationFrame(updateNetwork);
    }

    document.getElementById('addNodeBtn').addEventListener('click', () => addNode(false));
    document.getElementById('startSharingBtn').addEventListener('click', () => isSharing = true);
    document.getElementById('resetBtn').addEventListener('click', () => {
        cancelAnimationFrame(animationId);
        initNetwork();
        updateNetwork();
    });

    initNetwork();
    updateNetwork();
</script>
</body>
</html>
